name: Package VS Code extension

# Marketplace 게시는 이 artifact의 VSIX를 관리 화면에 직접 업로드함
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:extension-package
      - run: pnpm run package:extension
      - uses: actions/upload-artifact@v7
        with:
          name: vitrine-vsix
          path: apps/vscode-extension/*.vsix
